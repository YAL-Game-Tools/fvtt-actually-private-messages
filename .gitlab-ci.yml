# You can override the included template(s) by including variable overrides
# See https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#priority-of-environment-variables
stages:
  - test
  - tag

variables:
  GIT_STRATEGY: fetch

include:
  - template: Security/SAST.gitlab-ci.yml

tag-latest:
  stage: tag
  interruptible: true
  rules:
    - if: '$CI_COMMIT_TAG !~ "latest"'
  before_script:
    - git config --global user.name "${GITLAB_USER_NAME}"
    - git config --global user.email "${GITLAB_USER_EMAIL}"
    - git remote set-url origin  "https://${GITLAB_USER_LOGIN}:${CI_SECRET_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}"
    - export TAG_ABBREV=`git describe --tags --abbrev=0`
    - export TAG_COMMIT=`git show-ref -s refs/tags/${TAG_ABBREV}`
  script:
    - git remote show origin
    - git tag -fa latest -m "${TAG_ABBREV}" ${TAG_COMMIT}
    - git push origin --tags --force
